name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  package:
    name: Package (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -v
      - run: swift test -v
  ios-example:
    name: iOS example app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild -project Example/KitoScreensExample.xcodeproj -scheme KitoScreensExample -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build | xcpretty && exit ${PIPESTATUS[0]}
